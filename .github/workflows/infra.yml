name: Minecraft Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Was soll passieren?"
        type: choice
        options: [plan, apply, destroy]
        default: plan

concurrency: terraform

env:
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
  TF_VAR_region: ${{ secrets.OCI_REGION }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Backend-Config schreiben
        run: |
          echo 'endpoints = { s3 = "https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com" }' > backend.hcl

      - name: Init
        run: terraform init -backend-config=backend.hcl

      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: IP anzeigen
        if: inputs.action == 'apply'
        run: |
          echo "### Server-IP: $(terraform output -raw public_ip)" >> "$GITHUB_STEP_SUMMARY"